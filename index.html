<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Internal - SDN Pluit 03</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <!-- HALAMAN LOGIN -->
    <div id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-slate-200 p-8">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-blue-700 text-white font-extrabold text-xl rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-md">
                    P03
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900">Portal Internal</h1>
                <p class="text-sm text-slate-500 mt-1">SDN Pluit 03 • Jakarta Utara</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Email</label>
                    <input type="email" id="email" required placeholder="tu@sdnpluit03.sch.id"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Password</label>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-sm">
                </div>
                <p id="login-error" class="hidden text-xs text-red-600 font-semibold bg-red-50 p-3 rounded-lg"></p>
                <button type="submit" id="btn-login"
                    class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-xl shadow-md transition">
                    Masuk ke Portal
                </button>
            </form>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboard-view" class="hidden min-h-screen flex flex-col">
        <!-- Navbar -->
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-blue-700 text-white font-extrabold text-xs rounded-xl flex items-center justify-center">P03</div>
                    <div>
                        <span class="font-extrabold text-slate-900 block leading-none">PORTAL SDN PLUIT 03</span>
                        <span id="user-role-badge" class="text-[11px] font-bold uppercase text-blue-700">Memuat...</span>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-name" class="hidden sm:block text-sm font-semibold text-slate-700"></span>
                    <button id="btn-logout" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-3.5 py-2 rounded-lg transition">
                        Keluar
                    </button>
                </div>
            </div>
        </nav>

        <!-- Konten Utama -->
        <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1">
            <!-- Kartu Ringkasan -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-bold text-slate-500 uppercase">Total Siswa Terdata</span>
                    <div id="stat-siswa" class="text-3xl font-extrabold text-blue-800 mt-1">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-bold text-slate-500 uppercase">Total Rombel Aktif</span>
                    <div id="stat-rombel" class="text-3xl font-extrabold text-emerald-700 mt-1">0</div>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-bold text-slate-500 uppercase">Status Koneksi</span>
                    <div class="text-sm font-bold text-emerald-600 mt-2 flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Supabase RLS Aktif
                    </div>
                </div>
            </div>

            <!-- Panel Tabel Data Siswa -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <!-- Header & Filter -->
                <div class="p-5 border-b border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
                    <div>
                        <h2 class="font-extrabold text-slate-900 text-lg">Buku Induk Siswa</h2>
                        <p id="filter-info" class="text-xs text-slate-500">Memuat data...</p>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-2.5">
                        <input type="text" id="search-input" placeholder="Cari Nama / NISN / NIPD..."
                            class="px-3.5 py-2 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-600 outline-none w-full sm:w-64">
                        <select id="filter-rombel"
                            class="px-3.5 py-2 rounded-xl border border-slate-300 text-sm bg-white focus:ring-2 focus:ring-blue-600 outline-none">
                            <option value="">Semua Rombel</option>
                        </select>
                        <button id="btn-refresh" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition">
                            Refresh
                        </button>
                    </div>
                </div>

                <!-- Tabel -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
                            <tr>
                                <th class="px-5 py-3">NIPD / NISN</th>
                                <th class="px-5 py-3">Nama Lengkap</th>
                                <th class="px-5 py-3">L/P</th>
                                <th class="px-5 py-3">Rombel</th>
                                <th class="px-5 py-3">Status</th>
                                <th class="px-5 py-3 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-siswa" class="divide-y divide-slate-100">
                            <tr><td colspan="6" class="px-5 py-10 text-center text-slate-400">Memuat data siswa...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="px-5 py-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between text-xs">
                    <span id="page-info" class="text-slate-600 font-medium">Halaman 1</span>
                    <div class="flex gap-2">
                        <button id="btn-prev" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 font-bold disabled:opacity-40">Sebelumnya</button>
                        <button id="btn-next" class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 font-bold disabled:opacity-40">Berikutnya</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL DETAIL SISWA -->
    <div id="detail-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-2xl max-h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <div>
                    <h3 id="modal-nama" class="font-extrabold text-slate-900 text-lg">Detail Siswa</h3>
                    <p id="modal-sub" class="text-xs text-slate-500"></p>
                </div>
                <button id="btn-close-modal" class="text-slate-400 hover:text-slate-700 font-bold text-xl px-2">&times;</button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto space-y-5 text-sm">
                <!-- Diisi otomatis via JS -->
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // TEMPEL KUNCI SUPABASE LO DI SINI
        // ==========================================
        const SUPABASE_URL = "https://dgrqcysdrhydllwqjtht.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_c_D8HzLyf0_QH-g9v0FUPQ_jm2ZVlBN";

        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allSiswa = [];
        let filteredSiswa = [];
        let currentPage = 1;
        const pageSize = 25;

        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const btnLogin = document.getElementById('btn-login');

        // 1. Cek Session
        async function checkSession() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                showDashboard(session.user);
            } else {
                loginView.classList.remove('hidden');
                dashboardView.classList.add('hidden');
            }
        }

        // 2. Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            btnLogin.textContent = 'Memproses...';
            btnLogin.disabled = true;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
                loginError.textContent = 'Login gagal: Email atau password salah.';
                loginError.classList.remove('hidden');
                btnLogin.textContent = 'Masuk ke Portal';
                btnLogin.disabled = false;
            } else {
                showDashboard(data.user);
            }
        });

        // 3. Tampilkan Dashboard
        async function showDashboard(user) {
            loginView.classList.add('hidden');
            dashboardView.classList.remove('hidden');

            const { data: profile } = await db
                .from('profiles')
                .select('nama_lengkap, role')
                .eq('id', user.id)
                .single();

            if (profile) {
                document.getElementById('user-name').textContent = profile.nama_lengkap;
                document.getElementById('user-role-badge').textContent = 'Role: ' + profile.role;
            } else {
                document.getElementById('user-name').textContent = user.email;
                document.getElementById('user-role-badge').textContent = 'Role belum diatur';
            }

            loadSiswa();
        }

        // 4. Tarik Semua Data Siswa (Batch per 1000 biar >1000 siswa aman semua)
        async function loadSiswa() {
            const tbody = document.getElementById('tabel-siswa');
            tbody.innerHTML = '<tr><td colspan="6" class="px-5 py-10 text-center text-slate-400">Menarik data dari Supabase...</td></tr>';

            let hasil = [];
            let from = 0;
            const step = 1000;

            while (true) {
                const { data, error } = await db
                    .from('master_siswa')
                    .select('*')
                    .order('rombel_saat_ini', { ascending: true })
                    .order('nama_lengkap_siswa', { ascending: true })
                    .range(from, from + step - 1);

                if (error) {
                    tbody.innerHTML = `<tr><td colspan="6" class="px-5 py-10 text-center text-red-500">Error: ${error.message}</td></tr>`;
                    return;
                }

                hasil = hasil.concat(data);
                if (data.length < step) break;
                from += step;
            }

            allSiswa = hasil;
            document.getElementById('stat-siswa').textContent = allSiswa.length.toLocaleString('id-ID');

            // Isi Dropdown Filter Rombel
            const rombelSet = [...new Set(allSiswa.map(s => s.rombel_saat_ini).filter(Boolean))].sort();
            document.getElementById('stat-rombel').textContent = rombelSet.length;

            const selectRombel = document.getElementById('filter-rombel');
            const currentVal = selectRombel.value;
            selectRombel.innerHTML = '<option value="">Semua Rombel (' + rombelSet.length + ')</option>' +
                rombelSet.map(r => `<option value="${r}">${r}</option>`).join('');
            selectRombel.value = currentVal;

            applyFilter();
        }

        // 5. Filter & Pencarian
        function applyFilter() {
            const keyword = document.getElementById('search-input').value.toLowerCase().trim();
            const rombel = document.getElementById('filter-rombel').value;

            filteredSiswa = allSiswa.filter(s => {
                const matchRombel = !rombel || s.rombel_saat_ini === rombel;
                const matchKeyword = !keyword ||
                    (s.nama_lengkap_siswa || '').toLowerCase().includes(keyword) ||
                    (s.nomor_induk_siswa_nasional || '').toLowerCase().includes(keyword) ||
                    (s.nomor_induk_peserta_didik || '').toLowerCase().includes(keyword);
                return matchRombel && matchKeyword;
            });

            currentPage = 1;
            renderTable();
        }

        // 6. Render Tabel + Pagination
        function renderTable() {
            const tbody = document.getElementById('tabel-siswa');
            const totalPages = Math.max(1, Math.ceil(filteredSiswa.length / pageSize));
            const start = (currentPage - 1) * pageSize;
            const pageData = filteredSiswa.slice(start, start + pageSize);

            document.getElementById('filter-info').textContent =
                `Menampilkan ${filteredSiswa.length.toLocaleString('id-ID')} dari ${allSiswa.length.toLocaleString('id-ID')} siswa`;
            document.getElementById('page-info').textContent = `Halaman ${currentPage} dari ${totalPages}`;
            document.getElementById('btn-prev').disabled = currentPage <= 1;
            document.getElementById('btn-next').disabled = currentPage >= totalPages;

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-5 py-10 text-center text-slate-400">Data siswa tidak ditemukan.</td></tr>';
                return;
            }

            tbody.innerHTML = pageData.map(s => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="px-5 py-3 text-xs font-medium text-slate-600">
                        <div>${s.nomor_induk_peserta_didik || '-'}</div>
                        <div class="text-slate-400">${s.nomor_induk_siswa_nasional || '-'}</div>
                    </td>
                    <td class="px-5 py-3 font-bold text-slate-900">${s.nama_lengkap_siswa || '-'}</td>
                    <td class="px-5 py-3">${s.jenis_kelamin_siswa || '-'}</td>
                    <td class="px-5 py-3">
                        <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-50 text-blue-700">${s.rombel_saat_ini || '-'}</span>
                    </td>
                    <td class="px-5 py-3">
                        <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700">${s.status_siswa || 'Aktif'}</span>
                    </td>
                    <td class="px-5 py-3 text-right">
                        <button onclick="openDetail(${s.id})" class="text-xs font-bold text-blue-700 hover:text-blue-900 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition">
                            Detail
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        // 7. Buka Modal Detail Siswa
        window.openDetail = function(id) {
            const s = allSiswa.find(x => x.id === id);
            if (!s) return;

            document.getElementById('modal-nama').textContent = s.nama_lengkap_siswa || '-';
            document.getElementById('modal-sub').textContent = `${s.rombel_saat_ini || '-'} • NIPD: ${s.nomor_induk_peserta_didik || '-'} • NISN: ${s.nomor_induk_siswa_nasional || '-'}`;

            const row = (label, val) => `
                <div class="grid grid-cols-3 gap-2 py-1.5 border-b border-slate-100">
                    <span class="text-slate-500 text-xs font-semibold">${label}</span>
                    <span class="col-span-2 text-slate-900 font-medium">${val || '-'}</span>
                </div>`;

            document.getElementById('modal-body').innerHTML = `
                <div>
                    <h4 class="text-xs font-extrabold uppercase text-blue-700 mb-2">Biodata Siswa</h4>
                    ${row('NIK', s.nomor_induk_kependudukan_siswa)}
                    ${row('Jenis Kelamin', s.jenis_kelamin_siswa)}
                    ${row('TTL', (s.tempat_lahir_siswa || '-') + ', ' + (s.tanggal_lahir_siswa || '-'))}
                    ${row('Agama', s.agama_siswa)}
                    ${row('Alamat', `${s.alamat_siswa || '-'} RT ${s.rt_siswa || '-'} / RW ${s.rw_siswa || '-'}`)}
                    ${row('No. Telepon', s.nomor_telepon_siswa)}
                    ${row('Beasiswa', s.beasiswa)}
                </div>
                <div>
                    <h4 class="text-xs font-extrabold uppercase text-blue-700 mb-2">Data Ayah</h4>
                    ${row('Nama Ayah', s.nama_ayah)}
                    ${row('Pekerjaan', s.pekerjaan_ayah)}
                    ${row('Penghasilan', s.penghasilan_per_bulan_ayah)}
                    ${row('No. Telepon', s.nomor_telepon_ayah)}
                </div>
                <div>
                    <h4 class="text-xs font-extrabold uppercase text-blue-700 mb-2">Data Ibu</h4>
                    ${row('Nama Ibu', s.nama_ibu)}
                    ${row('Pekerjaan', s.pekerjaan_ibu)}
                    ${row('Penghasilan', s.penghasilan_per_bulan_ibu)}
                    ${row('No. Telepon', s.nomor_telepon_ibu)}
                </div>
            `;

            document.getElementById('detail-modal').classList.remove('hidden');
        };

        // Event Listeners
        document.getElementById('search-input').addEventListener('input', applyFilter);
        document.getElementById('filter-rombel').addEventListener('change', applyFilter);
        document.getElementById('btn-refresh').addEventListener('click', loadSiswa);
        document.getElementById('btn-prev').addEventListener('click', () => { currentPage--; renderTable(); });
        document.getElementById('btn-next').addEventListener('click', () => { currentPage++; renderTable(); });
        document.getElementById('btn-close-modal').addEventListener('click', () => document.getElementById('detail-modal').classList.add('hidden'));
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await db.auth.signOut();
            location.reload();
        });

        checkSession();
    </script>
</body>
</html>
